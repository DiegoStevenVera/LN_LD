<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Novela — Proyecto Diego</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CryptoJS para desencriptar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>

<body>

    <!-- ======= Botón Menú (Móvil) ======= -->
    <button id="menu-toggle">☰</button>

    <!-- ======= Menú lateral ======= -->
    <aside id="sidebar">
        <h2>📘 Volúmenes</h2>

        <ul class="menu">
            <!-- VOLUMEN 1 -->
            <li>
                <span class="vol-title">Volumen 1</span>
                <ul class="submenu">
                    <li onclick="cargarActo('data/vol1.json', 'acto1')">Acto 1 — El Encuentro</li>
                    <li onclick="cargarActo('data/vol1.json', 'acto2')">Acto 2 — El Dragón</li>
                    <li onclick="cargarActo('data/vol1.json', 'acto3')">Acto 3 — La Promesa</li>
                </ul>
            </li>

            <!-- VOLUMEN 2 (cuando lo crees) -->
            <li>
                <span class="vol-title">Volumen 2</span>
                <ul class="submenu">
                    <li>Próximamente...</li>
                </ul>
            </li>
        </ul>
    </aside>

    <!-- ======= Contenido principal ======= -->
    <main id="content">
        <div id="auth-container">
            <h1>🔐 Ingresa la clave para ver el contenido</h1>

            <input id="clave" type="password" placeholder="Clave aquí...">
            <button onclick="intentarDesencriptar()">Desencriptar</button>

            <div id="mensaje"></div>
        </div>


        <h2 id="titulo-acto"></h2>
        <pre id="texto" style="white-space:pre-wrap;"></pre>

        <!-- Aquí aparecerán las imágenes descifradas/ocultas -->
        <div id="imagenes"></div>
    </main>

    <!-- ======= Lógica JS ======= -->
    <script src="js/app.js"></script>

</body>

</html>
